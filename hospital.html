<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOMB TO TOMB - Hospital Entrance</title>
    <link rel="stylesheet" href="WT.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Fredoka:wght@700;800;900&family=Mali:wght@700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="gameApp">
    <!-- ==========================================
         CINEMATIC HD HOSPITAL INTRO CUTSCENE PAGE
    =========================================== -->
    <section id="hospitalScreen" class="screen active">
        <div class="cinematic-hospital-viewport" id="hospitalCutsceneViewport">
            <!-- High-Res Background Image Layer -->
            <div class="hospital-cinematic-bg"></div>

            <!-- Animated Red & White Rose Petals -->
            <div class="rose-petals-overlay">
                <span class="petal white-p1">🤍</span>
                <span class="petal white-p2">🤍</span>
                <span class="petal red-p1">🌹</span>
                <span class="petal red-p2">🌹</span>
            </div>

            <!-- Black Mahindra Thar SUV (100% Transparent Vector SVG - No White Box!) -->
            <div id="cinematicThar" class="cinematic-thar">
                <div class="thar-headlight-glow"></div>
                <svg viewBox="0 0 320 180" class="vector-thar-svg">
                    <ellipse cx="160" cy="165" rx="145" ry="12" fill="#000000" opacity="0.35" />
                    <rect x="8" y="142" width="16" height="8" rx="3" fill="#475569" />

                    <!-- Main Mahindra Thar Black SUV Body -->
                    <path d="M 20 140 L 25 105 Q 40 75 80 70 L 140 68 L 220 72 Q 255 78 285 100 L 305 118 L 308 142 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>
                    <path d="M 75 70 L 115 25 L 210 25 Q 230 25 242 45 L 260 72 Z" fill="#1e293b" stroke="#334155" stroke-width="2.5"/>
                    <path d="M 120 25 L 120 70 M 205 25 L 205 70" stroke="#0f172a" stroke-width="4"/>

                    <polygon points="125,30 200,30 195,66 125,66" fill="#38bdf8" opacity="0.5" stroke="#0f172a" stroke-width="2"/>
                    <polygon points="78,68 118,32 118,66" fill="#38bdf8" opacity="0.4" stroke="#0f172a" stroke-width="2"/>

                    <path d="M 245 72 L 298 96 L 298 128 L 245 128 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
                    <g transform="translate(265, 100)">
                        <rect x="0" y="0" width="4" height="18" rx="2" fill="#94a3b8"/>
                        <rect x="7" y="0" width="4" height="18" rx="2" fill="#94a3b8"/>
                        <rect x="14" y="0" width="4" height="18" rx="2" fill="#94a3b8"/>
                        <rect x="21" y="0" width="4" height="18" rx="2" fill="#94a3b8"/>
                    </g>

                    <circle cx="295" cy="98" r="10" fill="#fef08a" stroke="#cbd5e1" stroke-width="3"/>
                    <circle cx="295" cy="98" r="5" fill="#ffffff"/>
                    <rect x="22" y="110" width="8" height="20" rx="3" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>

                    <rect x="150" y="88" width="16" height="5" rx="2" fill="#94a3b8"/>
                    <rect x="110" y="138" width="100" height="8" rx="4" fill="#475569"/>

                    <!-- Wheels -->
                    <g class="thar-wheel rear-wheel">
                        <circle cx="75" cy="145" r="28" fill="#0f172a" stroke="#334155" stroke-width="4"/>
                        <circle cx="75" cy="145" r="16" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
                        <circle cx="75" cy="145" r="6" fill="#0f172a"/>
                        <line x1="75" y1="130" x2="75" y2="160" stroke="#cbd5e1" stroke-width="3"/>
                        <line x1="60" y1="145" x2="90" y2="145" stroke="#cbd5e1" stroke-width="3"/>
                    </g>

                    <g class="thar-wheel front-wheel">
                        <circle cx="235" cy="145" r="28" fill="#0f172a" stroke="#334155" stroke-width="4"/>
                        <circle cx="235" cy="145" r="16" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
                        <circle cx="235" cy="145" r="6" fill="#0f172a"/>
                        <line x1="235" y1="130" x2="235" y2="160" stroke="#cbd5e1" stroke-width="3"/>
                        <line x1="220" y1="145" x2="250" y2="145" stroke="#cbd5e1" stroke-width="3"/>
                    </g>
                </svg>

                <div class="exhaust-smoke">
                    <span class="smoke s1"></span>
                    <span class="smoke s2"></span>
                    <span class="smoke s3"></span>
                </div>
            </div>

            <!-- Husband in Formal Suit + Wife in Red Nighty Crying (100% Transparent SVG) -->
            <div id="cinematicCouple" class="cinematic-couple hidden">
                <svg viewBox="0 0 240 220" class="vector-couple-svg">
                    <ellipse cx="120" cy="205" rx="95" ry="10" fill="#000000" opacity="0.3" />

                    <g class="husband-sprite">
                        <rect x="42" y="160" width="14" height="35" rx="4" fill="#0f172a" />
                        <rect x="62" y="160" width="14" height="35" rx="4" fill="#0f172a" />
                        <ellipse cx="49" cy="195" rx="11" ry="6" fill="#020617" />
                        <ellipse cx="69" cy="195" rx="11" ry="6" fill="#020617" />

                        <path d="M 32 85 Q 60 78 88 85 L 88 160 L 32 160 Z" fill="#1e293b" />
                        <polygon points="52,85 68,85 60,125" fill="#ffffff" />
                        <polygon points="58,85 62,85 60,115" fill="#1e3a8a" />

                        <path d="M 82 95 Q 110 110 125 125" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>

                        <circle cx="60" cy="50" r="26" fill="#fbcfe8" />
                        <path d="M 34 45 Q 60 20 86 45 Q 86 32 60 26 Q 34 32 34 45 Z" fill="#0f172a" />

                        <path d="M 46 42 Q 52 36 58 44" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 64 44 Q 70 36 76 42" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="52" cy="50" r="4" fill="#0f172a" />
                        <circle cx="70" cy="50" r="4" fill="#0f172a" />
                        <path d="M 76 34 Q 82 40 78 44 C 74 44 74 38 76 34 Z" fill="#38bdf8" />
                        <ellipse cx="61" cy="62" rx="7" ry="5" fill="#991b1b" stroke="#e11d48" stroke-width="1.5"/>
                    </g>

                    <g class="wife-sprite">
                        <path d="M 115 90 Q 150 82 185 90 L 195 185 Q 150 195 105 185 Z" fill="#dc2626" />
                        <ellipse cx="148" cy="140" rx="32" ry="26" fill="#b91c1c" />
                        <path d="M 120 120 Q 148 110 176 120" stroke="#f43f5e" stroke-width="4" fill="none"/>

                        <path d="M 125 125 Q 148 145 160 135" fill="none" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round"/>

                        <circle cx="150" cy="52" r="26" fill="#fbcfe8" />
                        <path d="M 124 48 Q 150 20 176 48 C 182 80 185 110 180 120 C 172 70 174 45 150 26 C 126 45 128 70 120 120 Z" fill="#1e293b" />

                        <path d="M 136 48 L 144 54 L 136 60" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 164 48 L 156 54 L 164 60" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

                        <path d="M 134 56 Q 130 68 132 76" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 166 56 Q 170 68 168 76" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 140 64 Q 150 78 160 64 Z" fill="#991b1b" stroke="#e11d48" stroke-width="2"/>
                    </g>
                </svg>

                <div class="speech-bubble wife-speech">😭 Aaaagh! The pain! The baby is coming right now!</div>
                <div class="speech-bubble husband-speech">😰 Hang on my love! Stay strong, we are at Emergency!</div>
            </div>

            <!-- Nurse in Blue Dress with Stretcher Structure (100% Transparent SVG) -->
            <div id="cinematicNurse" class="cinematic-nurse hidden">
                <svg viewBox="0 0 270 220" class="vector-nurse-svg">
                    <ellipse cx="135" cy="205" rx="120" ry="10" fill="#000000" opacity="0.3" />

                    <g class="stretcher-structure">
                        <line x1="40" y1="135" x2="160" y2="190" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
                        <line x1="160" y1="135" x2="40" y2="190" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
                        <line x1="20" y1="135" x2="180" y2="135" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

                        <circle cx="40" cy="192" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
                        <circle cx="160" cy="192" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>

                        <rect x="15" y="110" width="170" height="24" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
                        <rect x="20" y="105" width="35" height="15" rx="5" fill="#38bdf8"/>
                        <path d="M 40 110 L 40 95 L 150 95 L 150 110" fill="none" stroke="#0284c7" stroke-width="3"/>
                    </g>

                    <g class="nurse-sprite">
                        <rect x="195" y="155" width="14" height="40" rx="5" fill="#0369a1" />
                        <rect x="218" y="155" width="14" height="40" rx="5" fill="#0369a1" />
                        <ellipse cx="202" cy="195" rx="11" ry="6" fill="#ffffff" />
                        <ellipse cx="225" cy="195" rx="11" ry="6" fill="#ffffff" />

                        <path d="M 185 85 Q 212 78 240 85 L 245 158 Q 212 165 180 158 Z" fill="#0284c7" />
                        <polygon points="205,85 220,85 212,105" fill="#ffffff" />
                        <rect x="192" y="110" width="12" height="16" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
                        <line x1="198" y1="114" x2="198" y2="122" stroke="#ef4444" stroke-width="2"/>
                        <line x1="194" y1="118" x2="202" y2="118" stroke="#ef4444" stroke-width="2"/>

                        <path d="M 190 98 Q 165 110 145 115" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>

                        <circle cx="212" cy="50" r="26" fill="#fbcfe8" />

                        <path d="M 188 42 Q 212 20 236 42 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
                        <line x1="212" y1="28" x2="212" y2="36" stroke="#ef4444" stroke-width="3"/>
                        <line x1="208" y1="32" x2="216" y2="32" stroke="#ef4444" stroke-width="3"/>

                        <path d="M 188 46 Q 212 32 236 46 Q 238 58 234 65 M 188 46 Q 186 58 190 65" stroke="#78350f" stroke-width="4" fill="none"/>

                        <circle cx="202" cy="50" r="3.5" fill="#0f172a" />
                        <circle cx="222" cy="50" r="3.5" fill="#0f172a" />
                        <circle cx="204" cy="48" r="1.5" fill="#ffffff" />
                        <circle cx="224" cy="48" r="1.5" fill="#ffffff" />

                        <ellipse cx="196" cy="56" rx="5" ry="3.5" fill="#f43f5e" opacity="0.6"/>
                        <ellipse cx="228" cy="56" rx="5" ry="3.5" fill="#f43f5e" opacity="0.6"/>

                        <path d="M 202 58 Q 212 72 222 58" fill="#f43f5e" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
                    </g>
                </svg>

                <div class="speech-bubble nurse-speech">😊 Don't worry! Everything will be fine! We are transferring her now!</div>
            </div>

            <!-- Skip Button -->
            <button id="btnSkipCutscene" class="btn-skip-cutscene">⏩ Skip Intro</button>

            <!-- Timeline Progress Bar (5s Gaps Tracker) -->
            <div class="cutscene-timeline-bar">
                <div id="cutsceneProgressFill" class="cutscene-progress-fill"></div>
            </div>
        </div>
    </section>
</div>

<script src="WT.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        startHospitalIntroPage();
    });
</script>
</body>
</html>
