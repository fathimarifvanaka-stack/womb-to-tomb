<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOMB TO TOMB - One Life. Infinite Choices.</title>
    <link rel="stylesheet" href="WT.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Fredoka:wght@700;800;900&family=Mali:wght@700;800&family=Outfit:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div id="gameApp">

        <!-- ==========================================
         1. LOGO SPLASH SCREEN (5s Hold + Auto Transition)
    =========================================== -->
        <section id="logoScreen" class="screen active">
            <div class="exact-logo-card" id="logoContainer">
                <div class="exact-logo-box">
                    <svg viewBox="0 0 340 380" class="exact-vector-logo-svg">
                        <!-- Surrounding Dark Teal Circular Arc -->
                        <path d="M 125 65 A 130 130 0 1 0 250 310" fill="none" stroke="#234b55" stroke-width="6.5"
                            stroke-linecap="round" />
                        <!-- Arrow Tip -->
                        <path d="M 238 314 L 255 310 L 250 292" fill="none" stroke="#234b55" stroke-width="6.5"
                            stroke-linecap="round" stroke-linejoin="round" />

                        <!-- Top Green 2-Leaf Sprout -->
                        <g transform="translate(140, 20)">
                            <path d="M 30 46 Q 30 24 30 10" stroke="#74a446" stroke-width="7.5" stroke-linecap="round"
                                fill="none" />
                            <!-- Left Leaf -->
                            <path d="M 30 22 C 10 22 2 2 30 8 C 30 8 24 22 30 22 Z" fill="#74a446" />
                            <!-- Right Leaf -->
                            <path d="M 30 22 C 50 22 58 2 30 8 C 30 8 36 22 30 22 Z" fill="#74a446" />
                            <!-- Veins -->
                            <path d="M 30 22 Q 18 12 8 14" stroke="#5a8435" stroke-width="2" fill="none" />
                            <path d="M 30 22 Q 42 12 52 14" stroke="#5a8435" stroke-width="2" fill="none" />
                        </g>

                        <!-- Yellow Sparkle Dash Accents -->
                        <!-- Left Side Accents -->
                        <line x1="22" y1="175" x2="44" y2="185" stroke="#f6be4e" stroke-width="7"
                            stroke-linecap="round" />
                        <line x1="26" y1="208" x2="48" y2="198" stroke="#f6be4e" stroke-width="7"
                            stroke-linecap="round" />

                        <!-- Right Side Accents -->
                        <line x1="318" y1="175" x2="296" y2="185" stroke="#f6be4e" stroke-width="7"
                            stroke-linecap="round" />
                        <line x1="314" y1="208" x2="292" y2="198" stroke="#f6be4e" stroke-width="7"
                            stroke-linecap="round" />

                        <!-- Bottom Coral Pink Heart -->
                        <path
                            d="M 170 320 C 158 304 142 312 142 324 C 142 334 162 348 170 354 C 178 348 198 334 198 324 C 198 312 182 304 170 320 Z"
                            fill="#ef696d" />

                        <!-- Womb Text (Coral Pink #ef696d) -->
                        <text x="170" y="178" text-anchor="middle" font-family="'Bubblegum Sans', 'Fredoka', cursive"
                            font-weight="900" font-size="92" fill="#ef696d">Womb</text>

                        <!-- TO Text (Dark Teal #234b55) -->
                        <text x="170" y="210" text-anchor="middle" font-family="'Fredoka', sans-serif" font-weight="900"
                            font-size="24" fill="#234b55" letter-spacing="2">TO</text>

                        <!-- Tomb' Text (Dark Teal #234b55) -->
                        <text x="170" y="292" text-anchor="middle" font-family="'Bubblegum Sans', 'Fredoka', cursive"
                            font-weight="900" font-size="92" fill="#234b55">Tomb'</text>
                    </svg>

                    <div class="logo-subtext">LOGO</div>
                </div>

                <div class="splash-loader">
                    <div class="splash-bar"></div>
                    <span class="splash-hint">Tap anywhere to skip (5s hold)</span>
                </div>
            </div>
        </section>

        <!-- ==========================================
         2. FRONT PAGE (Sunrise Landscape & Path)
    =========================================== -->
        <section id="menuScreen" class="screen">
            <!-- Top Right Handwritten Tagline -->
            <div class="opening-handwritten-tagline">
                <div>Same life...</div>
                <div>Different choices...</div>
                <div>Different outcomes...</div>
                <div class="tagline-heart">♡</div>
            </div>

            <div class="opening-content-box">
                <!-- Center Exact Logo Vector SVG (Single Title Artwork) -->
                <div class="opening-logo-container">
                    <svg viewBox="0 0 340 340" class="opening-vector-logo-svg">
                        <path d="M 125 55 A 120 120 0 1 0 250 280" fill="none" stroke="#174d46" stroke-width="6.5"
                            stroke-linecap="round" />
                        <path d="M 238 284 L 255 280 L 250 262" fill="none" stroke="#174d46" stroke-width="6.5"
                            stroke-linecap="round" stroke-linejoin="round" />

                        <g transform="translate(140, 15)">
                            <path d="M 30 46 Q 30 24 30 10" stroke="#4d7c38" stroke-width="7.5" stroke-linecap="round"
                                fill="none" />
                            <path d="M 30 22 C 10 22 2 2 30 8 C 30 8 24 22 30 22 Z" fill="#4d7c38" />
                            <path d="M 30 22 C 50 22 58 2 30 8 C 30 8 36 22 30 22 Z" fill="#4d7c38" />
                        </g>

                        <path
                            d="M 170 290 C 158 276 142 284 142 296 C 142 306 162 318 170 324 C 178 318 198 306 198 296 C 198 284 182 276 170 290 Z"
                            fill="#ef696d" />

                        <text x="170" y="155" text-anchor="middle" font-family="'Bubblegum Sans', 'Fredoka', cursive"
                            font-weight="900" font-size="95" fill="#ef696d">Womb</text>
                        <text x="170" y="185" text-anchor="middle" font-family="'Fredoka', sans-serif" font-weight="900"
                            font-size="24" fill="#174d46" letter-spacing="2">TO</text>
                        <text x="170" y="265" text-anchor="middle" font-family="'Bubblegum Sans', 'Fredoka', cursive"
                            font-weight="900" font-size="95" fill="#174d46">Tomb'</text>
                    </svg>
                </div>

                <!-- Deep Forest Green Start Button -->
                <button id="startButton" class="btn-opening-start">
                    <span>START YOUR LIFE →</span>
                </button>

                <!-- Subtle Gender Selector -->
                <div class="opening-gender-selector">
                    <button type="button" class="gender-btn active" id="genderBoyBtn" data-gender="boy">👦 Boy</button>
                    <button type="button" class="gender-btn" id="genderGirlBtn" data-gender="girl">👧 Girl</button>
                </div>
            </div>
        </section>

    </div>

    <script src="WT.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initMainMenuPage();
        });
    </script>
</body>

</html>
